# Lefthook。單一執行檔、跨平台,不需要 Node。
#
# 安裝(每個人 clone 之後跑一次):
#   go install github.com/evilmartians/lefthook@latest
#   go install github.com/conventionalcommit/commitlint@latest
#   go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
#   lefthook install
#
# 臨時跳過:  git commit --no-verify
# 但 CI 會再跑一次同樣的檢查,跳過只是延後,不是繞過。

commit-msg:
  jobs:
    - name: commitlint
      run: commitlint lint --message {1}

pre-commit:
  parallel: true
  jobs:
    - name: vet
      glob: "*.go"
      run: go vet ./...

    - name: golangci-lint
      glob: "*.go"
      run: golangci-lint run

pre-push:
  jobs:
    - name: test
      glob: "*.go"
      # -p 1 是必要的,不是保守:多個用 testcontainers 的套件同時建 Docker
      # provider,在 Windows 的 Docker Desktop 上會偶發
      # 「rootless Docker is not supported on Windows」而整批失敗。
      # 沒有它,pre-push 會隨機擋下正常的推送,然後大家學會用 --no-verify。
      run: go test -p 1 ./...
