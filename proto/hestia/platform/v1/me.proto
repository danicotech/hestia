syntax = "proto3";

// 「我」的資料。主體一律是 Authorization: Bearer 認出來的使用者,
// 所以請求裡沒有 user_public_id——不接受「代查別人」,那是管理端的事。
package hestia.platform.v1;

import "google/protobuf/timestamp.proto";
import "hestia/platform/v1/common.proto";

option go_package = "github.com/danicotech/hestia/gen/hestia/platform/v1;platformv1";

message GetProfileRequest {}

message GetProfileResponse {
  UserProfile profile = 1;
}

message GetBalanceRequest {
  // 幣別代碼(currencies.code);必填,不給預設值——多幣別下猜錯就是給錯數字。
  string currency = 1;
}

message GetBalanceResponse {
  Balance balance = 1;
}

// ListBalances 一次拿全部幣別。多幣別下前端要一次顯示,
// 逐幣別打 GetBalance 是 N 次往返。
message ListBalancesRequest {}

message ListBalancesResponse {
  repeated Balance balances = 1;
}

message ListEntitlementsRequest {
  // true = 連已撤銷(含已退款)的一起回。
  bool include_revoked = 1;
}

message ListEntitlementsResponse {
  repeated Entitlement entitlements = 1;
}

message ListRedemptionsRequest {
  // 只回指定狀態;UNSPECIFIED = 全部。
  RedemptionStatus status = 1;
}

message ListRedemptionsResponse {
  repeated Redemption redemptions = 1;
}

message UpdateTimezoneRequest {
  // IANA 時區名(如 Asia/Taipei)。改時區後簽到需距上次 ≥ 冷卻時數,
  // 這是防「改時區一天簽兩次」的設計(schemas/07-daily.md)。
  string timezone = 1;
}

message UpdateTimezoneResponse {
  UserProfile profile = 1;
}

// PrivacySettings 是兩級退出(schemas/02-identity.md 的 user_privacy_settings)。
//
// **兩個旗標是不同的東西,不是同一件事的兩種強度。**
// 使用者最常見的誤解是「我退出了就不算我的分數」——不是。兩者都不影響計分。
//
// 沒有設定過的使用者兩個旗標都是 false(表裡沒有列 = 預設值,不是錯誤)。
message PrivacySettings {
  // opt_out_logging = **不記錄原始活動 / 訊息內容**。
  //
  // 打開之後不會存訊息原文、編輯前後的內容這類「你說了什麼」的資料。
  //
  // **XP 與統計計數照常累積**(schemas/02:「仍計 XP,否則退出=逃避」)。
  // 記的是「你在 X 時間發了一則訊息」這種計數事實,不是內容本身 ——
  // 如果退出等於不計分,那它就變成一個逃避排行榜結算的按鈕,
  // 而不是隱私設定。這條語意寫在契約裡,呈現層必須照抄,不要自己改寫。
  bool opt_out_logging = 1;
  // opt_out_ai_corpus = **不納入 AI 語料**(向量庫 / 檢索 / 生成素材)。
  //
  // 與 opt_out_logging 各自獨立:可以「留紀錄但不進語料」,
  // 也可以「不留紀錄」(不留紀錄時自然也沒有語料可用,schemas/12
  // 的語料範圍跟隨訊息記錄,兩者天然一致,不需要同時打開)。
  bool opt_out_ai_corpus = 2;
}

message GetPrivacyRequest {}

message GetPrivacyResponse {
  PrivacySettings settings = 1;
}

// UpdatePrivacyRequest 的兩個欄位**各自可設**:
// 只想改一個就只帶一個,沒帶的那個維持原值(不是重設為 false)。
// 這是 optional 的用途——proto3 沒有 optional 的話,「沒帶」與「設成 false」
// 在線路上完全一樣,使用者關掉一個旗標會意外把另一個也關掉。
//
// 兩個都沒帶 = InvalidArgument。寫入 RPC 靜靜地什麼都不做,
// 比報錯更難查(呼叫端會以為設定成功了)。
message UpdatePrivacyRequest {
  optional bool opt_out_logging = 1;
  optional bool opt_out_ai_corpus = 2;
}

message UpdatePrivacyResponse {
  // 更新後的**完整**設定(不只是這次改的那個),
  // 呼叫端可以直接拿去顯示,不必自己合併。
  PrivacySettings settings = 1;
}

// GetSummary 一次回 /profile 要顯示的全部內容。
//
// 為什麼不讓呼叫端打四支:Discord 的互動視窗只有 3 秒,四次往返很容易超時,
// 而超時的表現是指令「沒有反應」—— 使用者只會再按一次,然後再超時一次。
message GetSummaryRequest {}

message GetSummaryResponse {
  UserProfile profile = 1;
  repeated Balance balances = 2;
  // 每個社群一列。沒有參加任何社群時是空的。
  repeated CommunityXp xp = 3;
  // 出戰中的寵物;沒有就不帶(不是錯誤,多數人一開始都沒有)。
  optional PetSummary pet = 4;
  // 最近取得的徽章,**不是全部** —— embed 有長度上限,全部送會被截掉。
  repeated BadgeSummary badges = 5;
}

// CommunityXp 是一個人在某社群的經驗與等級。
//
// 等級與進度由後端算好,不讓呈現層自己算:曲線存在 xp_rulesets.config,
// 各端各算一次就會有兩份實作,而其中一份遲早與資料庫不同步 ——
// 「網頁說我 12 級,bot 說我 11 級」是查不出來的那種問題。
message CommunityXp {
  string community_public_id = 1;
  string community_name = 2;
  int64 xp = 3;
  int32 level = 4;
  // 本級已累積 / 本級總共需要。兩個一起才畫得出進度條。
  int64 xp_into_level = 5;
  int64 xp_for_level = 6;
}

message PetSummary {
  string public_id = 1;
  // 主人取的暱稱;沒取就是物品定義的名稱。
  string name = 2;
  string icon_url = 3;
  string rarity = 4;
  int64 xp = 5;
  int32 level = 6;
}

// BadgeSummary 是一枚徽章。徽章不是獨立系統,是 category='badge' 的物品。
message BadgeSummary {
  string public_id = 1;
  string name = 2;
  string rarity = 3;
  string icon_url = 4;
  google.protobuf.Timestamp acquired_at = 5;
}

message GetLeaderboardRequest {
  // 社群的 public_id。
  string community_public_id = 1;
  // 取前幾名;<= 0 或超過上限一律夾到預設值(不為了顯示參數讓指令失敗)。
  int32 limit = 2;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_public_id = 2;
  string display_name = 3;
  int64 xp = 4;
  int32 level = 5;
}

service MeService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // 個人檔案總覽(/profile)。在代打白名單內:使用者的 Discord 身分由
  // Discord 自己證明,看自己的檔案是合理的。
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  // 排行榜。純讀取、不涉個資以外的資訊,同樣可代打。
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ListBalances(ListBalancesRequest) returns (ListBalancesResponse);
  rpc ListEntitlements(ListEntitlementsRequest) returns (ListEntitlementsResponse);
  rpc ListRedemptions(ListRedemptionsRequest) returns (ListRedemptionsResponse);
  rpc UpdateTimezone(UpdateTimezoneRequest) returns (UpdateTimezoneResponse);
  // GetPrivacy / UpdatePrivacy 在代打白名單內(見 transport/interceptors.go):
  // 使用者的 Discord 身分由 Discord 自己證明,從 /privacy 指令調整自己的
  // 隱私設定是合理的 —— 而且這是唯一做得出 `/privacy optout` 的路徑。
  rpc GetPrivacy(GetPrivacyRequest) returns (GetPrivacyResponse);
  rpc UpdatePrivacy(UpdatePrivacyRequest) returns (UpdatePrivacyResponse);
}
