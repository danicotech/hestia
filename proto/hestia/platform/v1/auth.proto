syntax = "proto3";

// 登入:OAuth2(第一個 provider 是 Discord)為主,另有一條本地憑證的路
// (LocalLogin,identities.provider = 'local'),見 schemas/02-identity.md。
// 本檔只是契約——handler 目前一律回 unimplemented,實作由 identity 層補上。
package hestia.platform.v1;

import "google/protobuf/timestamp.proto";
import "hestia/platform/v1/common.proto";

option go_package = "github.com/danicotech/hestia/gen/hestia/platform/v1;platformv1";

// Session 是一次登入產生的憑證。
// 注意:這是整份契約唯一出現 token 的地方,event_logs 的白名單摘要
// 對 AuthService 一律不記任何欄位值(schemas/13:絕不存 token / 密碼)。
message Session {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_token_expires_at = 4;
  // 登入者的 public_id;內部 user id 永不外露。
  string user_public_id = 5;
}

message StartDiscordLoginRequest {
  // 登入完成後要導回的前端位址;必須在伺服器端白名單內,空 = 用預設。
  string redirect_uri = 1;
}

message StartDiscordLoginResponse {
  // 要把使用者導去的 Discord authorize 位址。
  string authorize_url = 1;
  // CSRF state,回呼時原樣帶回。
  //
  // 同一個值也會由伺服器寫成 HttpOnly cookie(hestia_oauth_state),
  // 回呼時兩邊必須相符——光有簽章擋不住 login CSRF / session fixation:
  // 簽章只證明「這是我們發的」,不證明「它屬於發起登入的那個瀏覽器」。
  string state = 2;
}

message CompleteDiscordLoginRequest {
  // Discord 回呼帶回的授權碼。
  string code = 1;
  // StartDiscordLogin 發出的 state。
  //
  // 伺服器會同時比對 HttpOnly cookie 裡的同名值,不符(或 cookie 缺失)
  // 一律拒絕(PermissionDenied)。**前端契約**:瀏覽器端的 Connect client
  // 必須設 `credentials: "include"`,否則 cookie 不會被送出,登入永遠失敗。
  string state = 2;
}

message CompleteDiscordLoginResponse {
  Session session = 1;
  UserProfile profile = 2;
}

// LocalLogin:不經 Discord 的登入(identities.provider = 'local')。
//
// 為什麼需要:裁判的每一個動作(評段、抽籤、判勝負、發獎)都必須記在平台
// 帳號上(admin_audit_logs.actor_user_id 是 NOT NULL,權限走 user_roles),
// 但辦一場賽事不該被迫先去接 Discord。所以這不是「繞過平台帳號」,
// 是給平台帳號第二種登入方式 —— 發出來的 Session 與 Discord 登入的**完全同型**,
// 之後每一支 RPC、每一筆稽核都不必分辨來源。
//
// 帳號**沒有自助註冊**:local 身分只由 `admin create-judge` 建立。
message LocalLoginRequest {
  // 登入名。伺服器會去空白並轉小寫後比對,所以大小寫不敏感。
  string login_name = 1;
  // 通行碼。字元集已排除易混淆字元(0/O、1/I/l),比對前會去空白並轉大寫。
  string passcode = 2;
}

message LocalLoginResponse {
  Session session = 1;
  UserProfile profile = 2;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  Session session = 1;
}

message LogoutRequest {
  // 要撤銷的 refresh token;空 = 只撤銷當前 Authorization 帶的 session。
  string refresh_token = 1;
}

message LogoutResponse {}

// AuthService 全部方法都不需要 Authorization header(RefreshSession 用
// refresh_token 自證,Logout 兩者皆可)——認證攔截器對本服務整體豁免。
//
// **前端契約**:登入流程依賴 HttpOnly cookie(OAuth state 綁瀏覽器),
// 瀏覽器端的 Connect client 一律要設 `credentials: "include"`。
service AuthService {
  rpc StartDiscordLogin(StartDiscordLoginRequest) returns (StartDiscordLoginResponse);
  rpc CompleteDiscordLogin(CompleteDiscordLoginRequest) returns (CompleteDiscordLoginResponse);
  // LocalLogin 不依賴 cookie(沒有 OAuth state 要綁瀏覽器),
  // 但仍與其他登入 RPC 一樣對認證攔截器豁免 —— 登入前本來就沒有 token。
  rpc LocalLogin(LocalLoginRequest) returns (LocalLoginResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
