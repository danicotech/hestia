syntax = "proto3";

// 報名與選手登入(schemas/20、26)。
//
// ── 為什麼不用平台帳號 ──────────────────────────────────────────
//
// 報名**不需要**平台帳號。門檻要夠低:百業的成員未必都綁過 Discord OAuth,
// 而「先去登入再回來報名」會直接勸退一部分人。
//
// 代價是活動層要自己認一組身分。這造成雙軌:
//   選手    → 遊戲ID → 活動層 session
//   下注者  → 平台帳號 Bearer → 要動平台代幣
// 兩者可以是同一人:選手事後 BindPlatformAccount 即可。領獎**必須**先綁。
//
// ── 登入只要遊戲ID(2026-09-13 定案,推翻先前的通行碼登入)──────
//
// 報名只有 game_id 必填,登入也只要 game_id —— 沒有通行碼這一步了。
//
// 代價是清楚的而且是被接受的:遊戲ID 全服唯一且公開(對戰表上就印著),
// 所以任何人知道某位選手的遊戲ID 就能以他的身分登入、花掉他的 BP、
// 改他的讓武選擇。換來的是報名到登入之間沒有任何要抄、會抄錯、會弄丟的東西。
//
// 唯一的門鎖是**狀態**:只有 status = ACTIVE 的選手登得進來。棄賽
// (JudgeService.WithdrawPlayer)因此同時是「把這個人擋在外面」的手段,
// 不只是賽程上的處置;已淘汰者同樣登不進來。三種失敗(查無此 ID、
// 非 ACTIVE、格式不合)對呼叫端是**同一個**錯誤,不做任何區分。
//
// 通行碼沒有消失,只是不再是給選手看的東西:tournament_players.passcode_hash
// 照舊產生並寫入(NOT NULL),它的同伴 passcode_issued_at 則是**已發出的
// session 的作廢依據**。裁判的「重新產生通行碼」現在的意思是「把這個人
// 現在所有的 session 全部踢掉」—— 棄賽之外的第二道槓桿。
package hestia.activity.v1;

import "hestia/activity/v1/common.proto";

option go_package = "github.com/danicotech/hestia/gen/hestia/activity/v1;activityv1";

// SignupService 是選手側的報名與身分。
service SignupService {
  // 報名。只在賽事處於 SIGNUP 階段時開放。
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  // 用遊戲ID 換發活動層 session。沒有通行碼,只有 ACTIVE 的選手登得進來(見檔頭)。
  rpc Login(LoginRequest) returns (LoginResponse) {}
  // 結束活動層 session。
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  // 取得目前登入的選手。
  rpc GetMyPlayer(GetMyPlayerRequest) returns (GetMyPlayerResponse) {}
  // 把目前的活動層身分綁到平台帳號(領獎前必做)。
  rpc BindPlatformAccount(BindPlatformAccountRequest) returns (BindPlatformAccountResponse) {}
}

// RegisterRequest 是一份報名表。
//
// **只有 game_id 是必填的**(2026-09-13 定案)。其餘每一欄留空都能報名成功 ——
// 報名的門檻要低到「知道自己遊戲ID 就能報」,任何一個多出來的必填欄位
// 都會在報名頁上攔掉一部分人。
//
// 選填的那些全是**給裁判評段用的參考資料** —— 御風羽要綜合論劍段位、積分、
// 實戰經驗與整體 PVP 實力來評,所以表單問得比「你叫什麼」多;
// 但問得多不等於要求得多,沒填就是裁判少一份參考。
message RegisterRequest {
  // 要報名哪一屆,如 2026-baiye-shifeng。
  string tournament_slug = 1;
  // 遊戲ID。全服唯一,場上辨識與登入都用它。
  // 若這個 ID 報過往屆,伺服器會自動接上既有的選手檔案。
  string game_id = 2;
  // 顯示名。選填,留空則沿用 game_id。
  string display_name = 3;
  // Discord 名稱。選填 —— 裁判聯絡與公告 tag 用,沒填就只能在遊戲裡找人。
  string discord_name = 4;
  // 自評段位。選填。除了當評段起點,也讓裁判看得出誰高估或低估自己。
  Rank self_rated_rank = 5;
  // 遊戲內論劍段位。選填。
  string ladder_rank = 6;
  // 遊戲內積分。選填(0 = 沒填)。
  int32 ladder_score = 7;
  // 常用武學 / PVP 經驗描述。選填。沒實際對過時的判斷依據,也能做選手介紹卡。
  string arts_note = 8;
  // 可出賽時段 / 備註。選填。裁判排輪次時程用。
  string availability_note = 9;
}

// RegisterResponse 是報名的結果。
//
// **刻意沒有通行碼**(2026-09-13):登入只要遊戲ID,所以回一組明碼通行碼
// 只會讓人以為那是要保存的東西。欄位 2 保留不再使用,避免哪天被重新賦義
// 而讓舊客戶端把新欄位當成通行碼顯示出來。
message RegisterResponse {
  reserved 2;
  reserved "passcode";

  Player player = 1;
  // true = 這個遊戲ID 在往屆報過名,已接上既有檔案。
  // 前端可據此顯示「歡迎回來,上屆你是斷水」。
  bool returning_fencer = 3;
  // 往屆最後一次的評定段位;UNSPECIFIED = 初次參賽或從未評過。
  // 這**不是**本屆段位 —— 本屆要等裁判重新評定。
  Rank previous_rank = 4;
}

// LoginRequest 只要遊戲ID。
//
// 欄位 3 是原本的 passcode,保留不再使用:舊客戶端照送不會壞,但伺服器
// 從此不看它,也不會有人把那個位置改成別的意思。
message LoginRequest {
  reserved 3;
  reserved "passcode";

  string tournament_slug = 1;
  // 遊戲ID。查無、非 ACTIVE、格式不合一律回同一個錯誤(見檔頭)。
  string game_id = 2;
}

message LoginResponse {
  Player player = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMyPlayerRequest {}

message GetMyPlayerResponse {
  Player player = 1;
  // 本屆賽事的當前狀態,前端用來決定顯示哪個畫面。
  Tournament tournament = 2;
  // 目前輪到我打的比賽;空 = 沒有待打的場次(已出局、或還沒抽籤)。
  optional Match current_match = 3;
}

// BindPlatformAccountRequest 需要**同時**持有活動層 session(通行碼登入)
// 與平台 Bearer(Discord OAuth 登入)。伺服器把兩個身分接起來。
//
// 刻意不讓裁判代綁:綁定決定獎金匯到誰的帳戶,必須由本人雙重證明。
message BindPlatformAccountRequest {}

message BindPlatformAccountResponse {
  Player player = 1;
}
