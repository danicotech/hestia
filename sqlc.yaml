# sqlc:寫真 SQL,生成型別安全的 Go code(規劃書 §5 工具鏈)
# schema 來源 = goose migration(唯一權威,不另外維護 schema 快照)
version: "2"
sql:
  - engine: "postgresql"
    # 兩個 schema 都要餵給解析器,否則 activity 的查詢會被當成「表不存在」。
    # 順序即依賴方向:platform 先,activity 後。
    # 抽成 themis 的那天,activity 那行連同 migrations/activity 一起搬走。
    schema:
      - "migrations/platform"
      - "migrations/activity"
    queries: "internal/infrastructure/storage/queries"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/storage/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "*time.Time"
